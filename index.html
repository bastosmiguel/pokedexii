<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédexii</title>
    <link rel="icon" type="image/png" href="./source/images/pokeball.png">
    <link href="./style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single:wght@100..900&family=Press+Start+2P&family=Tiny5&display=swap" rel="stylesheet">
</head>
<body>
<header>
    <p>Pokédexii <img id="icone-pokebola" src="./source/images/pokeball.png"></p>
</header>
    <div id="pokedex">
        <div id="pesquisa">
            <input type="text" id="campo-pesquisa" class="input" placeholder="Número ou nome do Pokémon">
            <button id="botao-pesquisa">Pesquisar</button>
        </div>
        <div id="mensagem-erro"></div>
        <div>
            <div id="imagens">
                <div><img id="img-normal-pokemon" class="imagem-pokemon" src="" alt="Pokémon Normal"></div>
                <div><img id="img-shiny-pokemon" class="imagem-pokemon" src="" alt="Pokémon Shiny"></div>
            </div>
            <div id="informacoes">
                <div>Nº: <span id="pokemon-numero"></span></div>
                <div>Nome: <span id="pokemon-nome"></span></div>
                <div>Tipagem: <span id="pokemon-tipagem"></span></div>
                <div>Peso: <span id="pokemon-peso"></span></div>
                <div>Altura: <span id="pokemon-altura"></span></div>
            </div>
            <div id="stats">
                <h3>Stats:</h3>
                <ul id="lista-stats"></ul>
            </div>
        </div>
        <div id="navegacao">
            <button id="botao-anterior"><img src="./source/images/arrowleft.png"></button>
            <button id="botao-proximo"><img src="./source/images/arrowright.png"></button>
        </div>
    </div>
    <script src="./script.js"></script>
<footer>
    <p>&copy; Copyright 2026 - Miguel de Bastos | 2026</p>
</footer>
</body>
</html>
